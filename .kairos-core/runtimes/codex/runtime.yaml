id: codex
status: beta
description: Runtime Codex. Materializa o Kairos nos caminhos esperados pelo Codex.

capabilities:
  command_persona:
    mode: skill
    source: .kairos-core/agents/kairos.md
    entrypoint: .agents/skills/kairos/SKILL.md
  active_agent_continuity:
    mode: session_context
    persistence: session_only
    clear_on: "*exit"
    scope: all_messages_until_exit
  context_loading:
    mode: explicit
    map: context-map.yaml
  boundary_enforcement:
    mode: protocol
    policy: boundary-policy.yaml
  pre_compaction_digest:
    mode: unsupported
    fallback: reload_context_on_kairos_intent
  version_check:
    mode: unsupported
  squad_agent_materialization:
    status: unsupported
    mode: pending_phase_5
    target_pattern: null

protocol:
  project_context: AGENTS.md
  agent_entrypoint: .agents/skills/kairos/SKILL.md
  command_prefix: "*"
  canonical_sources:
    constitution: .kairos-core/constitution.md
    manifest: .kairos-core/manifest.yaml
    config: .kairos-core/core-config.yaml
    agents: .kairos-core/agents/
    rules: .kairos-core/rules/
    instructions: .kairos-core/instructions/
    tasks: .kairos-core/tasks/
  session_state:
    persistence: session_only
    active_agent_scope: all_messages_until_exit
    variables:
      - chat_active
      - yolo_active
      - pre_push_passed
    storage: conversation_context

materialize:
  - template: templates/AGENTS.md
    target: AGENTS.md
    type: markdown_blocks
    blocks:
      - name: kairos-codex-bootloader
        source: templates/bootloader.md
  - source: templates/SKILL.md
    target: .agents/skills/kairos/SKILL.md
    type: owned_file
  - source: templates/hooks.json
    target: .codex/hooks.json
    type: owned_file
