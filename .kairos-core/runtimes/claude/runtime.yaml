id: claude
status: stable
description: Runtime Claude Code. Materializa o Kairos nos caminhos esperados pelo Claude Code.

capabilities:
  command_persona:
    mode: native_command
    source: .kairos-core/agents/kairos.md
    entrypoint: .claude/commands/kairos/agents/kairos.md
  active_agent_continuity:
    mode: session_context
    persistence: session_only
    clear_on: "*exit"
    scope: all_messages_until_exit
  context_loading:
    mode: native
    via:
      - CLAUDE.md
      - .claude/commands/kairos/agents/
      - .claude/rules/
  boundary_enforcement:
    mode: hybrid
    source_of_truth: .kairos-core/manifest.yaml
    rule: .kairos-core/rules/ownership.md
    assistive_hooks:
      - .claude/hooks/kairos-code-intel.cjs
  pre_compaction_digest:
    mode: native_hook
    hook: .claude/hooks/kairos-precompact.cjs
  version_check:
    mode: native_hook
    hook: .claude/hooks/kairos-version-check.cjs
  squad_agent_materialization:
    status: supported
    mode: native_command_targets
    target_pattern: .claude/commands/kairos/agents/{agent-id}.md

protocol:
  project_context: CLAUDE.md
  agent_entrypoint: .claude/commands/kairos/agents/kairos.md
  command_prefix: "*"
  canonical_sources:
    constitution: .kairos-core/constitution.md
    manifest: .kairos-core/manifest.yaml
    config: .kairos-core/core-config.yaml
    agents: .kairos-core/agents/
    rules: .kairos-core/rules/
    instructions: .kairos-core/instructions/
    tasks: .kairos-core/tasks/
  session_state:
    persistence: session_only
    active_agent_scope: all_messages_until_exit
    variables:
      - chat_active
      - yolo_active
      - pre_push_passed

materialize:
  - template: templates/CLAUDE.md
    target: CLAUDE.md
    type: markdown_blocks
    blocks:
      - name: framework-conventions
        source: ../../instructions/framework-conventions.md
      - name: agent-system
        source: ../../instructions/agent-system.md
      - name: kairos-core
        source: ../../instructions/core-structure.md

  - source: ../../rules/ownership.md
    target: .claude/rules/ownership.md
    type: owned_file
  - source: ../../rules/agent-authority.md
    target: .claude/rules/agent-authority.md
    type: owned_file
  - source: ../../rules/framework-layers.md
    target: .claude/rules/framework-layers.md
    type: owned_file
  - source: ../../rules/ids-principles.md
    target: .claude/rules/ids-principles.md
    type: owned_file
  - source: ../../rules/output-naming.md
    target: .claude/rules/output-naming.md
    type: owned_file
  - source: ../../rules/agent-handoff.md
    target: .claude/rules/agent-handoff.md
    type: owned_file
  - source: ../../rules/story-lifecycle.md
    target: .claude/rules/story-lifecycle.md
    type: owned_file
  - source: ../../rules/external-integrations.md
    target: .claude/rules/external-integrations.md
    type: owned_file

  - source: hooks/kairos-code-intel.cjs
    target: .claude/hooks/kairos-code-intel.cjs
    type: owned_file
  - source: hooks/kairos-precompact.cjs
    target: .claude/hooks/kairos-precompact.cjs
    type: owned_file
  - source: hooks/kairos-version-check.cjs
    target: .claude/hooks/kairos-version-check.cjs
    type: owned_file

  - source: ../../agents/kairos.md
    target: .claude/commands/kairos/agents/kairos.md
    type: owned_file
