  instanceScopeFile: docs/scope.md
  constitutionFile: .kairos-core/constitution.md
  kbFile: .kairos-core/data/kairos-kb.md
  workersFile: .kairos-core/data/workers.yaml
runtime:
  handoffsLocation: .kairos-core/runtime/handoffs/
  outputsLocation: data/outputs/
versioning:
  scheme: semver
  bump_rules:
    MAJOR: Novo escopo, breaking change, mudança de arquitetura, modificações em arquivos
      L1
    MINOR: Novo comando, nova task, nova rule, nova capacidade ou expansão significativa
      de capacidade
    PATCH: Correção de bugs, ajuste de instrução, documentação
  story_required_for:
  - MAJOR
  - MINOR
  authority: kairos
