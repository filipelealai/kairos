version: 3.6.1
installedAt: '2026-04-06T00:00:00.000Z'
updatedAt: '2026-04-24T00:00:00.000Z'
project:
  name: '{project-name}'
  type: claude-code-orchestrator
  owner: '{owner}'
  scope: personal
agents:
  master: kairos
  squads: {}
framework:
  tasksLocation: .kairos-core/tasks/
  agentsLocation: .kairos-core/agents/
  dataLocation: .kairos-core/data/
  templatesLocation: .kairos-core/templates/
  commandsLocation: .claude/commands/kairos/agents/
  rulesLocation: .claude/rules/
  hooksLocation: .claude/hooks/
  squadsLocation: squads/
  storiesLocation: docs/stories/
  changelogFile: CHANGELOG.md
  frameworkScopeFile: .kairos-core/docs/scope.md
  instanceScopeFile: docs/scope.md
  constitutionFile: .kairos-core/constitution.md
  kbFile: .kairos-core/data/kairos-kb.md
  workersFile: .kairos-core/data/workers.yaml
runtime:
  handoffsLocation: .kairos-core/runtime/handoffs/
  outputsLocation: data/outputs/
  reportsLocation: data/outputs/cold-prospecting/reports/
  emailsLocation: data/outputs/cold-prospecting/emails/
versioning:
  scheme: semver
  bump_rules:
    MAJOR: Novo escopo/squad adicionado OU breaking change em agente existente
    MINOR: Novo agente, nova task, nova rule ou expansão significativa de capacidade
    PATCH: Correção de bug, atualização de MEMORY.md, ajuste de instrução de task/rule
  story_required_for:
  - MAJOR
  - MINOR
  authority: kairos
