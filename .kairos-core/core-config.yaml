version: 4.0.1
installedAt: '2026-04-06T00:00:00.000Z'
updatedAt: '2026-05-11T00:00:00.000Z'

update_source: https://github.com/filipelealweb/kairos

agents:
  master: kairos
  squads:
    cold-prospecting:
      agents: [campaign-analyst, lead-scorer, niche-classifier, email-writer]
      status: active
      version: 1.0.0
    sales-pipeline:
      agents: [pre-call, call-analyst]
      status: active
      version: 0.1.0
    client-onboarding:
      agents: [brief-extractor, proposal-writer, contract-writer, onboarding-writer]
      status: active
      version: 0.1.0

framework:
  tasksLocation: .kairos-core/tasks/
  agentsLocation: .kairos-core/agents/
  dataLocation: .kairos-core/data/
  templatesLocation: .kairos-core/templates/
  commandsLocation: .claude/commands/kairos/agents/
  rulesLocation: .claude/rules/
  hooksLocation: .claude/hooks/
  squadsLocation: squads/
  storiesLocation: docs/stories/
  changelogFile: CHANGELOG.md
  frameworkScopeFile: .kairos-core/docs/scope.md
  instanceScopeFile: docs/scope.md
  constitutionFile: .kairos-core/constitution.md
  kbFile: .kairos-core/data/kairos-kb.md
  workersFile: .kairos-core/data/workers.yaml

runtime:
  handoffsLocation: .kairos-core/runtime/handoffs/
  outputsLocation: data/outputs/

versioning:
  scheme: semver
  bump_rules:
    MAJOR: "Novo escopo, breaking change, mudança de arquitetura, modificações em arquivos L1"
    MINOR: "Novo comando, nova task, nova rule, nova capacidade ou expansão significativa de capacidade"
    PATCH: "Correção de bugs, ajuste de instrução, documentação"
  story_required_for: [MAJOR, MINOR]
  authority: kairos

devLoadAlwaysFiles:
  - .kairos-core/docs/agent-standards.md
  - .kairos-core/docs/data-flow.md
  - docs/scope.md
