name: {squad-name}
description: "{Descrição de uma linha do que o squad faz}"
context: {contexto-do-usuario-ou-equipe}
status: active | planned
version: 1.0.0

# Contexto de negócio
business_context: |
  {Por que este squad existe e qual problema resolve.}

# Agentes do squad
agents:
  - id: {agent-id-1}
    name: {NomeDaPersona}
    icon: {emoji}
    role: "{papel do agente no squad}"

  - id: {agent-id-2}
    name: {NomeDaPersona}
    icon: {emoji}
    role: "{papel do agente no squad}"

# Pipeline principal
pipeline:
  order: [{agent-id-1}, {agent-id-2}]
  partial_execution: true  # Cada agente pode rodar individualmente
  triggers:
    - {condição de disparo — ex: "volume de pendentes > 500"}

# Dados
data:
  source: webhook | arquivo | api | manual
  source_url: "{URL ou path da fonte}"
  outputs_location: data/outputs/{squad-name}/
  reports_location: data/outputs/{squad-name}/reports/
  emails_location: data/outputs/{squad-name}/emails/  # se aplicável

# Integrações externas
integrations: []  # liste as integrações externas do squad (ex: n8n, google_sheets, salesforce, make)

# Dependências — adapte para sua stack
dependencies:
  # adapte para sua stack
  # node: [tsx, "@anthropic-ai/sdk", dotenv]
  # python: [requests, anthropic]
  squads: []
  external: []
