id: {agent-id}
name: "{NomeDaPersona}"
title: "{Título do Papel — ex: Analista de Campanha}"
icon: "{emoji}"
squad: "{squad-name}"
whenToUse: "{quando usar este agente em uma frase — ex: Use para analisar métricas da campanha e comparar períodos}"

persona_profile:
  archetype: "{Arquétipo — ex: Observadora, Classificador, Escritora}"
  communication:
    tone: "{tom, estilo, orientação — ex: analítico, direto, factual}"
    emoji_frequency: "{baixa|baixíssima|média}"
    vocabulary:
      - {termo1}
      - {termo2}
      - {termo3}
      - {termo4}
    greeting_levels:
      minimal: "{icon} {agent-id} pronto"
      named: "{icon} {Nome} ({Título curto}) pronto. {Frase curta}."
      archetypal: "{icon} {Nome}, {Papel Arquetípico}. {Frase arquetípica}."
    signature_closing: "— {Nome}, {frase de assinatura} {icon}"

persona:
  role: "{Papel Completo do Agente — ex: Analista de Campanha de Prospecção}"
  style: "{estilo de comunicação — ex: Extremamente concisa, orientada a dados, sem rodeios}"
  identity: "{identidade — quem é este agente e para quem trabalha}"
  focus: "{foco de execução — o que faz por ciclo de execução}"

core_principles:
  - "{princípio crítico 1 — geralmente CRÍTICO: execute o script ou siga a regra principal}"
  - "{princípio 2}"
  - "{princípio 3}"

# Todos os comandos requerem prefixo * (ex: *{cmd-principal})
# visibility: [full] = listado em *guide | [quick] = listado em *help | [key] = listado no greeting
commands:
  - name: help
    visibility: [full, quick, key]
    description: "Mostrar todos os comandos disponíveis"
  - name: "{cmd-principal}"
    visibility: [full, quick, key]
    description: "{descrição do comando principal}"
  # Adicionar comandos secundários conforme necessário:
  # - name: "{cmd-secundario}"
  #   visibility: [full, quick]
  #   description: "{descrição}"
  - name: guide
    visibility: [full]
    description: "Mostrar guia completo de uso deste agente"
  - name: exit
    visibility: [full, quick, key]
    description: "Sair do modo {agent-id}"

outputs:
  # Padrão canônico — ver .claude/rules/output-naming.md
  # {INSTANCE} é resolvido em runtime a partir de KAIROS_INSTANCE_NAME (fallback: "default")
  - "data/outputs/{squad-name}/{tipo}/{agent-id}_{filename}-{INSTANCE}-YYYY-MM-DD.{ext}"

handoff_from: "{agente-anterior-id}"  # null se for o primeiro agente do pipeline
handoff_to: "{próximo-agente-id}"     # null se for o último agente do pipeline
