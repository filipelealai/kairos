notes: "- Arquivos squad-operational (analyze-campaign.md, write-emails.md, etc.)\n  NÃO são framework — vivem em .kairos-core/tasks/ mas são conteúdo do usuário\n  por não estarem neste manifesto (default-deny).\n\
  \n- Personas de agentes de squad (.claude/commands/kairos/agents/{squad-agent}.md)\n  são user-content. Apenas .claude/commands/kairos/agents/kairos.md é framework.\n\n- MEMORY.md em .kairos-core/agents/*/MEMORY.md\
  \ é SEMPRE user-content\n  (memória persistente aprendida) — nunca entra no manifesto.\n\n- Stories e epics em docs/stories/ e docs/epics/ são metadados de projeto\n  (histórico de desenvolvimento do\
  \ Kairos neste repo) — não são shipped para\n  instâncias instaladas, logo não entram no manifesto.\n\n- package.json, package-lock.json, tsconfig.json, docs/scope.md,\n  .gitignore, .mcp.json são metadados\
  \ da instância — não são gerenciados por\n  updates de framework, logo não entram no manifesto.\n\n- src/ é integralmente user-owned (incluindo src/tools/ e src/agents/) —\n  nenhum arquivo de src/ está\
  \ listado neste manifesto. Por default-deny,\n  qualquer operação de update ou @kairos jamais toca em src/.\n\n- CHANGELOG.md é framework-owned (L3): histórico de versões faz parte do artefato\n  entregue\
  \ pelo framework.\n\n- README.md é sync_files (L3): sincronizado para origin/main como documentação pública,\n  mas não gerenciado por updates — conteúdo instância-específico, nunca sobrescrito\n  por\
  \ `kairos update`.\n"
