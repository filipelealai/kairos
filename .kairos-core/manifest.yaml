notes: |
  - Arquivos squad-operational (analyze-campaign.md, write-emails.md, etc.)
    NÃO são framework — vivem em .kairos-core/tasks/ mas são conteúdo do usuário
    por não estarem neste manifesto (default-deny).

  - Personas de agentes de squad (.claude/commands/kairos/agents/{squad-agent}.md)
    são user-content. Apenas .claude/commands/kairos/agents/kairos.md é framework.

  - MEMORY.md em .kairos-core/agents/*/MEMORY.md é SEMPRE user-content
    (memória persistente aprendida) — nunca entra no manifesto.

  - Rules globais canônicas vivem em .kairos-core/rules/. .claude/rules/ é target
    materializado do runtime Claude.

  - AGENTS.md é mixed: o bloco kairos-codex-bootloader é framework-owned; conteúdo
    fora dos markers é user-owned.

  - .agents/skills/kairos/ e .codex/hooks.json são targets materializados do
    runtime Codex. Outros arquivos em .agents/ e .codex/config.toml são user-owned.

  - Stories e epics em docs/stories/ e docs/epics/ são metadados de projeto
    (histórico de desenvolvimento do Kairos neste repo) — não são shipped para
    instâncias instaladas, logo não entram no manifesto.

  - package.json, package-lock.json, tsconfig.json, docs/scope.md e .mcp.json são
    metadados da instância — não são gerenciados por updates de framework, logo
    não entram no manifesto.

  - src/ é integralmente user-owned (incluindo src/tools/ e src/agents/) —
    nenhum arquivo de src/ está listado neste manifesto. Por default-deny,
    qualquer operação de update ou @kairos jamais toca em src/.

  - CHANGELOG.md é framework-owned (L3): histórico de versões faz parte do
    artefato entregue pelo framework.

  - README.md é sync_files (L3): sincronizado para origin/main como documentação
    pública, mas não gerenciado por updates — conteúdo instância-específico,
    nunca sobrescrito por `kairos update`.
