name: Validate Manifest

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Kairos Manifest Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mikefarah/yq via action oficial. Estratégia @latest deliberada — alinhada
      # com version-guard.yml. Se um bump major quebrar a sintaxe, voltar a pin
      # específico documentando o motivo.
      - name: Setup yq
        uses: mikefarah/yq@latest

      - name: Run manifest validation
        run: bash .github/scripts/validate-manifest.sh
