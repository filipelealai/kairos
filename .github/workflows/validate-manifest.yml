name: Validate Manifest

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Kairos Manifest Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup yq
        uses: mikefarah/yq@v4.44.6

      - name: Run manifest validation
        run: bash .github/scripts/validate-manifest.sh
