name: Version Guard

on:
  pull_request:
    branches:
      - main

jobs:
  version-guard:
    name: Kairos Version Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # mikefarah/yq via action oficial (Go binary cross-platform, sem runtime extra).
      # Estratégia @latest deliberada — alinhada com validate-manifest.yml. Se um bump
      # major do yq quebrar a sintaxe, voltar a pin específico documentando o motivo.
      - name: Setup yq
        uses: mikefarah/yq@latest

      - name: Run version-guard.sh
        env:
          BASE: origin/main
        run: |
          bash .github/scripts/version-guard.sh
