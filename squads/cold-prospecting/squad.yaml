name: cold-prospecting
version: 1.0.0
description: >
  Squad especializado no pipeline completo de prospecção fria B2B:
  análise de campanha → scoring de leads → classificação de nichos → geração de e-mails personalizados.
  Opera sobre dados do Google Sheets via webhook n8n e gera e-mails prontos para disparo automatizado.
author: Filipe Leal

kairos:
  minVersion: "1.0.0"
  type: squad
  scope: cold-prospecting

components:
  agents:
    - agents/campaign-analyst.md
    - agents/lead-scorer.md
    - agents/niche-classifier.md
    - agents/email-writer.md
  tasks:
    - tasks/analyze-campaign.md
    - tasks/score-leads.md
    - tasks/classify-niches.md
    - tasks/write-emails.md
  workflows:
    - workflows/full-pipeline.md
  templates: []

config:
  scope: ../../docs/scope.md
  agent-standards: ../../docs/framework/agent-standards.md
  data-flow: ../../docs/framework/data-flow.md

pipeline:
  order:
    - campaign-analyst  # *analyze
    - lead-scorer       # *score
    - niche-classifier  # *classify
    - email-writer      # *write N
  partial_execution: true  # qualquer subset do pipeline é válido

data:
  input_webhook: https://n8n.vendoteca.com/webhook/kairos-leads
  outputs:
    - data/reports/campaign-YYYY-MM-DD.md
    - data/reports/scored-leads-YYYY-MM-DD.csv
    - data/reports/niche-map-YYYY-MM-DD.json
    - data/emails/emails-YYYY-MM-DD.json
  handoffs: .kairos/handoffs/

dependencies:
  node:
    - tsx
    - "@anthropic-ai/sdk"
    - dotenv
  squads: []
  external:
    - n8n webhook (kairos-leads)
    - Google Sheets (via n8n)

tags:
  - cold-prospecting
  - email-marketing
  - lead-scoring
  - b2b
  - brasil
  - kairos
